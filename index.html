<!DOCTYPE html>
  <html lang="zh-Hant">
  <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>數學冒險島｜國一代數與數論探索</title>
  <style>
  :root{
    --bg-1:#151233;
  --bg-2:#1d1a45;
  --panel:#242058;
  --panel-2:#2b276b;
  --panel-light:#33308a;
  --border:#4a45a3;
  --text:#f1efff;
      --text-dim:#b8b3e8;
      --accent-teal:#2dd4bf;
  --accent-amber:#fbbf24;
      --accent-coral:#fb7185;
      --accent-purple:#a78bfa;
      --accent-green:#4ade80;
  --accent-red:#f87171;
      --radius:16px;
  --shadow: 0 8px 24px rgba(0,0,0,0.35);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  background: radial-gradient(circle at 20% 0%, #2a2570 0%, var(--bg-1) 55%) fixed;
  color:var(--text);
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
#app{max-width:980px;margin:0 auto;padding:0 16px 80px;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
.hidden{display:none !important;}

/* ---------- Header ---------- */
header.topbar{
  position:sticky;top:0;z-index:50;
  background:linear-gradient(135deg,#201c52,#2a2570);
  border-bottom:1px solid var(--border);
  padding:10px 16px;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  box-shadow:var(--shadow);
}
.topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;letter-spacing:.5px;cursor:pointer;flex-shrink:0;}
.topbar .brand .logo-emoji{font-size:1.4rem;}
  .topbar .spacer{flex:1;}
  .stat-pill{
      display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,.06);
  border:1px solid var(--border);
  border-radius:999px;
  padding:5px 12px;
  font-size:.82rem;font-weight:700;white-space:nowrap;
}
.level-badge{
    background:linear-gradient(135deg,var(--accent-purple),#7c3aed);
  border-radius:999px;width:30px;height:30px;
  display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:.78rem;flex-shrink:0;
  box-shadow:0 0 0 2px rgba(167,139,250,.35);
}
.xp-bar-wrap{width:110px;height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;flex-shrink:0;}
.xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-teal),var(--accent-purple));border-radius:999px;transition:width .4s ease;}
.streak-pill{color:var(--accent-amber);}
.streak-pill.hot{animation:pulseHot 1s infinite;}
@keyframes pulseHot{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
.icon-btn{
    background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;
  width:36px;height:36px;display:flex;align-items:center;justify-content:center;
  font-size:1.1rem;color:var(--text);flex-shrink:0;
  }
.icon-btn:hover{background:rgba(255,255,255,.14);}

/* ---------- Layout / Cards ---------- */
  .screen{padding-top:20px;animation:fadeIn .35s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  h1.page-title{font-size:1.5rem;margin:6px 0 4px;}
p.page-sub{color:var(--text-dim);margin:0 0 20px;font-size:.95rem;}

.unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media (max-width:680px){.unit-grid{grid-template-columns:1fr;}}
.unit-card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
    transition:transform .15s ease;
}
  .unit-card:not(.locked):hover{transform:translateY(-3px);}
.unit-card.locked{opacity:.55;filter:grayscale(.4);}
    .unit-card .unit-icon{font-size:2.2rem;}
.unit-card h3{margin:10px 0 4px;font-size:1.15rem;}
.unit-card p{color:var(--text-dim);font-size:.87rem;margin:0 0 14px;line-height:1.5;}
.progress-track{height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-bottom:8px;}
  .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-teal),var(--accent-green));transition:width .4s ease;}
.unit-meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text-dim);}
.stars{color:var(--accent-amber);letter-spacing:2px;font-size:.9rem;}
.unit-cta{
    margin-top:14px;display:inline-flex;align-items:center;gap:6px;
  background:linear-gradient(135deg,var(--accent-teal),#0ea5a5);
  color:#062a28;font-weight:800;border:none;border-radius:10px;
  padding:9px 16px;font-size:.88rem;
}
.unit-cta:hover{filter:brightness(1.08);}
.lock-overlay{position:absolute;top:14px;right:14px;font-size:1.3rem;}

.badges-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
.badge-chip{
    display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);
  border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--text-dim);
}
.badge-chip.earned{color:var(--text);border-color:var(--accent-amber);background:rgba(251,191,36,.08);}

/* ---------- Unit flow ---------- */
.unit-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
.back-btn{
    background:none;border:1px solid var(--border);color:var(--text-dim);
  border-radius:8px;padding:6px 10px;font-size:.82rem;
}
.back-btn:hover{color:var(--text);}
.phase-stepper{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap;}
.phase-dot{
    flex:1;min-width:60px;text-align:center;padding:8px 4px;border-radius:10px;
  font-size:.72rem;font-weight:700;background:rgba(255,255,255,.05);
  color:var(--text-dim);border:1px solid transparent;
}
.phase-dot.active{background:rgba(45,212,191,.15);color:var(--accent-teal);border-color:var(--accent-teal);}
.phase-dot.done{color:var(--accent-green);}

.card{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));
  border:1px solid var(--border);border-radius:var(--radius);
  padding:22px;box-shadow:var(--shadow);margin-bottom:18px;
}
.tag{
    display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.5px;
  padding:4px 10px;border-radius:999px;margin-bottom:12px;
}
.tag.hook{background:rgba(251,113,133,.15);color:var(--accent-coral);}
.tag.discovery{background:rgba(45,212,191,.15);color:var(--accent-teal);}
.tag.formalize{background:rgba(167,139,250,.15);color:var(--accent-purple);}
.tag.practice{background:rgba(251,191,36,.15);color:var(--accent-amber);}
.tag.boss{background:rgba(248,113,113,.18);color:var(--accent-red);}

.prompt-text{font-size:1.08rem;line-height:1.75;margin-bottom:16px;}
.prompt-text b{color:var(--accent-amber);}
.helper-note{font-size:.82rem;color:var(--text-dim);margin:-8px 0 14px;}

.answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
input[type=text],input[type=number]{
  background:rgba(0,0,0,.25);border:1.5px solid var(--border);border-radius:10px;
  color:var(--text);padding:10px 14px;font-size:1rem;min-width:0;flex:1;max-width:280px;
}
input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--accent-teal);}
.btn{
    border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:.9rem;
  background:linear-gradient(135deg,var(--accent-teal),#0ea5a5);color:#062a28;
}
.btn:hover{filter:brightness(1.08);}
.btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
.btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border);}
.btn.ghost{background:transparent;color:var(--accent-teal);border:1px solid var(--accent-teal);}
.btn.warn{background:linear-gradient(135deg,var(--accent-coral),#e11d48);color:#3a0512;}
.mc-options{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
.mc-btn{
    text-align:left;background:rgba(255,255,255,.04);border:1.5px solid var(--border);
  border-radius:12px;padding:12px 16px;color:var(--text);font-size:.95rem;
}
.mc-btn:hover{border-color:var(--accent-teal);}
.mc-btn.selected{border-color:var(--accent-purple);background:rgba(167,139,250,.12);}
.mc-btn.correct{border-color:var(--accent-green);background:rgba(74,222,128,.14);}
.mc-btn.wrong{border-color:var(--accent-red);background:rgba(248,113,113,.14);}

.feedback{
    margin-top:12px;padding:12px 16px;border-radius:12px;font-size:.9rem;line-height:1.6;
  animation:fadeIn .25s ease;
}
.feedback.correct{background:rgba(74,222,128,.12);border:1px solid var(--accent-green);color:#c9f7d5;}
.feedback.wrong{background:rgba(248,113,113,.1);border:1px solid var(--accent-red);color:#ffd7d5;}
.feedback.info{background:rgba(167,139,250,.1);border:1px solid var(--accent-purple);color:#e5deff;}

.hint-zone{margin-top:14px;}
.hint-btn{
    background:rgba(251,191,36,.1);border:1px dashed var(--accent-amber);color:var(--accent-amber);
  border-radius:10px;padding:8px 14px;font-size:.82rem;margin:4px 6px 0 0;
               }
.hint-btn:hover{background:rgba(251,191,36,.2);}
.hint-btn:disabled{opacity:.35;}
.hint-box{
    background:rgba(255,255,255,.05);border-left:3px solid var(--accent-amber);
  padding:10px 14px;border-radius:8px;margin-top:8px;font-size:.86rem;color:var(--text-dim);
                 }

.step-progress-label{font-size:.78rem;color:var(--text-dim);margin-bottom:10px;}
.formalize-block h4{color:var(--accent-purple);margin:18px 0 6px;font-size:1rem;}
.formalize-block h4:first-child{margin-top:0;}
.formula-box{
  background:rgba(0,0,0,.25);border:1px solid var(--accent-purple);border-radius:12px;
  padding:14px 18px;font-size:1.1rem;text-align:center;margin:10px 0;color:var(--accent-purple);font-weight:800;
}

/* ---------- Sieve grid ---------- */
.sieve-wrap{margin-top:10px;}
  .sieve-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--text-dim);margin-bottom:12px;}
.sieve-legend span{display:inline-flex;align-items:center;gap:5px;}
.legend-dot{width:14px;height:14px;border-radius:50%;display:inline-block;}
.legend-dot.prime{background:var(--accent-green);}
.legend-dot.comp{background:var(--accent-red);}
.legend-dot.unset{background:rgba(255,255,255,.2);}
.sieve-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-bottom:14px;
                                                                         }
.sieve-cell{
    aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:8px;
  font-size:.82rem;font-weight:700;color:var(--text);position:relative;
}
.sieve-cell.prime{background:rgba(74,222,128,.18);border-color:var(--accent-green);color:#c9f7d5;}
.sieve-cell.comp{background:rgba(248,113,113,.12);border-color:var(--accent-red);color:#ffd7d5;text-decoration:line-through;}
.sieve-cell.pulse-wrong{animation:shakeWrong .4s ease;}
.sieve-cell.pulse-right{animation:popRight .4s ease;}
@keyframes shakeWrong{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
@keyframes popRight{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
.sieve-status{font-size:.85rem;color:var(--text-dim);margin-bottom:10px;}

/* ---------- Boss ---------- */
.boss-frame{
    border:2px solid var(--accent-red);border-radius:var(--radius);
  background:radial-gradient(circle at 30% 0%,rgba(248,113,113,.12),transparent 60%),linear-gradient(160deg,var(--panel),var(--panel-2));
  padding:24px;
}
.boss-title{font-size:1.3rem;font-weight:900;color:var(--accent-red);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
.boss-part{border-top:1px dashed var(--border);padding-top:16px;margin-top:16px;}
.boss-part:first-of-type{border-top:none;margin-top:0;}
.boss-part-label{font-size:.8rem;color:var(--accent-amber);font-weight:800;margin-bottom:6px;}

/* ---------- Practice question index chips ---------- */
.qchip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
.qchip{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:.72rem;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-dim);}
.qchip.correct{background:rgba(74,222,128,.2);border-color:var(--accent-green);color:#c9f7d5;}
.qchip.current{border-color:var(--accent-teal);color:var(--accent-teal);}

/* ---------- Toast ---------- */
#toast-stack{position:fixed;top:70px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:280px;}
.toast{
    background:linear-gradient(135deg,#242058,#33308a);border:1px solid var(--accent-teal);
  border-radius:12px;padding:10px 14px;font-size:.85rem;box-shadow:var(--shadow);
  animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards;
}
.toast.badge{border-color:var(--accent-amber);}
.toast.level{border-color:var(--accent-purple);}
@keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
@keyframes toastOut{to{opacity:0;transform:translateX(30px);}}

/* ---------- Modal ---------- */
.modal-backdrop{
    position:fixed;inset:0;background:rgba(10,8,30,.75);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:20px;
}
.modal{
    background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--border);
  border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:85vh;overflow:auto;
  box-shadow:var(--shadow);
}
.modal h3{margin-top:0;}
.badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;}
.badge-tile{
    background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
  padding:12px;text-align:center;font-size:.78rem;color:var(--text-dim);
}
.badge-tile.earned{border-color:var(--accent-amber);color:var(--text);background:rgba(251,191,36,.08);}
.badge-tile .bicon{font-size:1.8rem;display:block;margin-bottom:6px;}

/* ---------- Celebration ---------- */
#celebrate-overlay{
  position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
  background:rgba(8,6,24,.85);
}
.celebrate-card{
    text-align:center;background:linear-gradient(160deg,#2b276b,#1d1a45);border:2px solid var(--accent-amber);
  border-radius:20px;padding:36px 30px;max-width:420px;width:92%;box-shadow:0 0 60px rgba(251,191,36,.25);
  animation:celebratePop .4s cubic-bezier(.34,1.56,.64,1);
}
@keyframes celebratePop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
.celebrate-card .big-emoji{font-size:3.2rem;}
  .celebrate-card h2{margin:8px 0 4px;color:var(--accent-amber);}
.celebrate-card p{color:var(--text-dim);font-size:.9rem;}
#confetti-canvas{position:fixed;inset:0;z-index:399;pointer-events:none;}

footer.site-footer{text-align:center;color:var(--text-dim);font-size:.75rem;padding:30px 0 10px;}

@media (max-width:520px){
  .stat-pill{padding:4px 8px;font-size:.74rem;}
  .xp-bar-wrap{width:70px;}
      .celebrate-card{padding:26px 18px;}
}

.numberline-wrap{margin-top:10px;}
.numberline-row{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:10px 0 16px;}
.numberline-cell{min-width:38px;height:38px;padding:0 6px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:8px;font-size:.82rem;font-weight:700;color:var(--text);cursor:pointer;transition:all .15s ease;}
.numberline-cell:hover{background:rgba(167,139,250,.15);border-color:var(--accent-purple);}
.numberline-cell.zero{border-color:var(--accent-amber);color:var(--accent-amber);}
.numberline-cell.correct-pick{background:rgba(74,222,128,.22);border-color:var(--accent-green);color:#c9f7d5;transform:translateY(-4px);}
.numberline-cell.wrong-pick{animation:shakeWrong .4s ease;}
.chip-wrap{margin-top:10px;}
.chip-piles{display:flex;justify-content:center;gap:36px;flex-wrap:wrap;margin:14px 0 6px;min-height:50px;}
.chip-pile{display:flex;flex-wrap:wrap;gap:8px;max-width:260px;justify-content:center;align-content:flex-start;}
.chip{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:.92rem;cursor:pointer;transition:transform .15s ease,opacity .25s ease;user-select:none;}
.chip:hover{transform:scale(1.1);}
.chip.pos{background:rgba(74,222,128,.18);border:2px solid var(--accent-green);color:#c9f7d5;}
.chip.neg{background:rgba(248,113,113,.15);border:2px solid var(--accent-red);color:#ffd7d5;}
.chip-result{text-align:center;font-size:1.35rem;font-weight:800;margin:8px 0 4px;color:var(--accent-amber);}
.chip-hint-note{text-align:center;color:var(--text-dim);font-size:.82rem;margin-top:6px;}

.achv-section-title{font-size:.82rem;font-weight:800;color:var(--accent-teal);margin:16px 0 8px;}
.achv-section-title:first-of-type{margin-top:6px;}
.badge-tile.rarity-rare.earned{border-color:var(--accent-purple);box-shadow:0 0 12px rgba(167,139,250,.25);}
.badge-tile.rarity-epic.earned{border-color:var(--accent-amber);box-shadow:0 0 16px rgba(251,191,36,.35);background:linear-gradient(160deg,rgba(251,191,36,.14),rgba(255,255,255,.04));}
.badge-tile.locked{opacity:.6;}
.badge-tile .unlock-date{margin-top:6px;font-size:.7rem;color:var(--text-dim);}
.badge-chip.rarity-epic.earned{border-color:var(--accent-amber);box-shadow:0 0 8px rgba(251,191,36,.3);}
.badge-chip.rarity-rare.earned{border-color:var(--accent-purple);}

.tile-choices{flex-direction:row !important;flex-wrap:wrap;}
.tile-btn{flex:0 0 auto;min-width:68px;text-align:center;font-weight:800;}

.lineup-wrap{margin-top:10px;}
.lineup-progress{font-size:.82rem;color:var(--text-dim);margin-bottom:8px;}
.lineup-slots{display:flex;gap:8px;justify-content:center;margin-bottom:14px;}
.lineup-slot{width:46px;height:46px;border:2px dashed var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;color:var(--text-dim);}
.lineup-slot.filled{border-style:solid;border-color:var(--accent-teal);background:rgba(45,212,191,.12);color:var(--text);}
.lineup-tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:6px;}
.lineup-tile{width:50px;height:50px;border-radius:10px;border:1.5px solid var(--border);background:rgba(255,255,255,.06);font-size:1.35rem;}
.lineup-tile:hover{border-color:var(--accent-teal);}
.lineup-tile.used{opacity:.25;}
.lineup-gallery{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;justify-content:center;}
.lineup-found-item{background:rgba(74,222,128,.12);border:1px solid var(--accent-green);border-radius:8px;padding:6px 10px;font-size:1rem;}

.ratio-slider-wrap{margin-top:10px;text-align:center;}
.ratio-visual{margin-bottom:14px;font-size:1rem;line-height:1.6;}
.ratio-slider-wrap input[type=range]{width:100%;max-width:360px;accent-color:var(--accent-teal);}
.ratio-slider-value{margin-top:8px;font-size:.85rem;color:var(--text-dim);}
.pizza-wrap{margin-top:10px;text-align:center;}
.pizza-slices{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px;}
.pizza-slice{width:46px;height:46px;border-radius:50%;border:1.5px solid var(--border);background:rgba(255,255,255,.06);font-size:1.4rem;}
.pizza-slice:hover{border-color:var(--accent-teal);}
.pizza-slice.eaten{opacity:.45;border-color:var(--accent-red);}
.pizza-count{font-size:.85rem;color:var(--text-dim);}

.angle-wrap{margin-top:10px;text-align:center;}
.angle-svg{width:100%;max-width:280px;height:auto;}
.angle-readout{margin:8px 0;font-size:.95rem;color:var(--text);font-weight:700;}
.triangle-wrap{margin-top:10px;text-align:center;}
.triangle-svg{width:100%;max-width:260px;height:auto;margin-bottom:10px;}
.triangle-controls{display:flex;flex-direction:column;gap:8px;align-items:center;margin-bottom:8px;}
.triangle-ctrl-row{display:flex;align-items:center;gap:10px;font-size:.9rem;}
.triangle-ctrl-row .btn{padding:4px 12px;}

.path-node{display:flex;flex-direction:column;align-items:center;gap:4px;flex-shrink:0;width:64px;}
.path-node-circle{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:2px solid var(--border);background:var(--panel-2);cursor:pointer;transition:transform .15s ease;}

// ---- 工具：算式檢查 (以數值代入比對，容忍各種等價寫法) ----
function safeEvalExpr(expr, n){
    const cleaned = expr.replace(/\s+/g,'').replace(/×/g,'*').replace(/x/gi,'n');
        if(!/^[0-9n+\-*/().]+$/i.test(cleaned)) return null;
  // 支援 3n 這種省略乘號寫法 -> 3*n
  const withMul = cleaned.replace(/(\d)(n)/gi,'$1*$2').replace(/(n)(\d)/gi,'$1*$2').replace(/(n)\(/gi,'$1*(').replace(/\)(n)/gi,')*$1').replace(/\)(\d)/g,')*$1').replace(/(\d)\(/g,'$1*(');
  try{
    // eslint-disable-next-line no-new-func
    const fn = new Function('n', 'return (' + withMul + ');');
    const v = fn(n);
    return (typeof v === 'number' && isFinite(v)) ? v : null;
  }catch(e){ return null; }
}
function checkExprEquivalent(userExpr, expectedExpr){
    if(!userExpr || !userExpr.trim()) return false;
  const testPoints = [1,2,5,7,11];
  for(const n of testPoints){
        const a = safeEvalExpr(userExpr, n);
    const b = safeEvalExpr(expectedExpr, n);
    if(a===null || b===null) return false;
    if(Math.abs(a-b) > 1e-9) return false;
}
  return true;
}
function parseNumberList(str){
    if(!str) return [];
  return str.split(/[,，、\s]+/).map(s=>s.trim()).filter(s=>s.length>0).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
}
function arraysEqual(a,b){
    if(a.length!==b.length) return false;
  for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; }
  return true;
}
function isPrime(num){
    if(num < 2) return false;
  for(let i=2;i*i<=num;i++){ if(num % i === 0) return false; }
  return true;
}

let STATE = null;

function loadProgress(){
    try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(raw){
      const parsed = JSON.parse(raw);
      // 合併預設值以防未來擴充欄位缺漏
      const def = defaultProgress();
      STATE = Object.assign(def, parsed);
      STATE.units = STATE.units || {};
      STATE.units.unit1 = Object.assign(defaultUnitState(), {unlocked:true}, parsed.units && parsed.units.unit1 || {});
      STATE.units.unit2 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit2 || {});
      STATE.units.unit3 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit3 || {});
      STATE.units.unit4 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit4 || {});
      STATE.units.unit5 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit5 || {});
      STATE.units.unit6 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit6 || {});
      STATE.units.unit7 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit7 || {});
      STATE.units.unit8 = Object.assign(defaultUnitState(), parsed.units && parsed.units.unit8 || {});
      return;
    }
    }catch(e){ console.warn('讀取進度失敗，使用預設值', e); }
  STATE = defaultProgress();
}
function saveProgress(){
    try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }

}

/* ---- XP / Level ---- */
const XP_PER_LEVEL = 80;
function levelFromXp(xp){ return Math.floor(xp / XP_PER_LEVEL) + 1; }
function xpIntoLevel(xp){ return xp % XP_PER_LEVEL; }

function addXp(amount, reason){
    const beforeLevel = levelFromXp(STATE.xp);
  STATE.xp = Math.max(0, STATE.xp + amount);
  const afterLevel = levelFromXp(STATE.xp);
  if(STATE.xp >= 150) awardBadge('xp_bronze');
  if(STATE.xp >= 400) awardBadge('xp_silver');
  if(STATE.xp >= 800) awardBadge('xp_gold');
  saveProgress();
  updateHeaderStats();
  if(amount > 0) showToast(`✨ +${amount} XP　${reason||''}`, 'xp');
    if(afterLevel > beforeLevel){
    showToast(`🎉 升級了！Lv.${afterLevel}`, 'level');
      }
    }
function registerCorrect(){
    STATE.streak += 1;
  if(STATE.streak > STATE.maxStreak) STATE.maxStreak = STATE.streak;
  if(STATE.streak === 5) awardBadge('streak_bronze');
  if(STATE.streak === 10) awardBadge('streak_silver');
  if(STATE.streak === 20) awardBadge('streak_gold');
  saveProgress();
  updateHeaderStats();
}
function registerWrong(){
    STATE.streak = 0;
  saveProgress();
  updateHeaderStats();
}
function awardBadge(id){
    if(!STATE.badges.includes(id)){
    STATE.badges.push(id);
    STATE.badgeUnlocks = STATE.badgeUnlocks || {};
    STATE.badgeUnlocks[id] = new Date().toISOString();
    saveProgress();
    const b = BADGES[id];
    if(b){
      showToast(`🏅 獲得新徽章：${b.icon} ${b.name}`, 'badge');
      if(b.rarity === 'epic'){ celebrateEpicBadge(); }
    }
                                        }
    }
function celebrateEpicBadge(){
  try{ runConfetti(); }catch(e){}
  try{ playChime(); }catch(e){}
  try{
    const flash = document.createElement('div');
    flash.style.position='fixed'; flash.style.inset='0'; flash.style.zIndex='450';
    flash.style.background='radial-gradient(circle, rgba(251,191,36,.35), transparent 70%)';
    flash.style.pointerEvents='none';
    flash.style.transition='opacity .8s ease';
    document.body.appendChild(flash);
    requestAnimationFrame(()=>{ flash.style.opacity='0'; });
    setTimeout(()=>{ flash.remove(); }, 850);
  }catch(e){}
}
function playChime(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(!AC) return;
  const ctx = new AC();
  const notes = [660, 880];
  notes.forEach((freq, i)=>{
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(0.001, ctx.currentTime + i*0.14);
    gain.gain.linearRampToValueAtTime(0.12, ctx.currentTime + i*0.14 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.14 + 0.3);
    osc.connect(gain); gain.connect(ctx.destination);
    osc.start(ctx.currentTime + i*0.14);
    osc.stop(ctx.currentTime + i*0.14 + 0.32);
  });
}
function checkMilestones(){
  if(typeof UNITS === 'undefined') return;
  const allBossDone = UNITS.every(u => STATE.units[u.id] && STATE.units[u.id].bossDone);
  if(allBossDone) awardBadge('all_boss_cleared');
  const allPerfect = UNITS.every(u => STATE.badges.includes('perfect' + u.id.replace('unit','')));
  if(allPerfect) awardBadge('all_perfect');
  const allHookSeen = UNITS.every(u => STATE.units[u.id] && STATE.units[u.id].hookSeen);
  if(allHookSeen) awardBadge('explorer_all_units');
}

function unitProgressPercent(unitId){
    const u = getUnit(unitId);
  const s = STATE.units[unitId];
  if(!s.unlocked) return 0;
  let total = 1 + u.discovery.length + 1 + u.practice.length + 1; // hook + discovery + formalize + practice + boss
  let done = 0;
  if(s.hookSeen) done += 1;
  done += Math.min(s.discoveryIndex, u.discovery.length);
  if(s.formalizeCheckDone) done += 1;
  done += Object.values(s.practiceAnswers).filter(a=>a.correct).length;
  if(s.bossDone) done += 1;
  return Math.round(done/total*100);
}
function unitStars(unitId){
    const s = STATE.units[unitId];
  if(!s.bossDone) return 0;
  if(s.hintsUsedTotal === 0) return 3;
  if(s.hintsUsedTotal <= 5) return 2;
  return 1;
}

/* ---- Unit flow controller ---- */
function enterUnit(unitId){
  const s = STATE.units[unitId];
  let phase = 'hook';
  if(s.hookSeen) phase='discovery';
  if(s.discoveryDone) phase='formalize';
  if(s.formalizeCheckDone) phase='practice';
  if(s.practiceDone) phase='boss';
  if(s.bossDone) phase='complete';
  CURRENT_UNIT_PHASE = {unitId, phase};
  renderUnitScreen();
}
function gotoPhase(phase){
    CURRENT_UNIT_PHASE.phase = phase;
  renderUnitScreen();
  window.scrollTo({top:0, behavior:'smooth'});
}

function renderUnitScreen(){
    const {unitId, phase} = CURRENT_UNIT_PHASE;
  const u = getUnit(unitId);
  const app = document.getElementById('app');
  const phases = ['hook','discovery','formalize','practice','boss'];
  const currentIdx = phases.indexOf(phase==='complete'?'boss':phase);
  const stepper = phases.map((p,i)=>{
    let cls='phase-dot';
    if(i<currentIdx || phase==='complete') cls+=' done';
    else if(i===currentIdx) cls+=' active';
    const labels={hook:'引子問題',discovery:'引導發現',formalize:'正式化',practice:'練習題',boss:'魔王挑戰'};
    return `<div class="${cls}">${labels[p]}</div>`;
}).join('');

  app.innerHTML = `
    <div class="screen">
      <div class="unit-header">
        <button class="back-btn" onclick="goHome()">← 回單元選單</button>
        <h1 class="page-title" style="margin:0;">${u.icon} ${u.title}</h1>
      </div>
      <div class="phase-stepper">${stepper}</div>
      <div id="phase-content"></div>
    </div>
  `;
  const target = document.getElementById('phase-content');
  if(phase==='hook') renderHookPhase(u, target);
  else if(phase==='discovery') renderDiscoveryPhase(u, target);
  else if(phase==='formalize') renderFormalizePhase(u, target);
  else if(phase==='practice') renderPracticePhase(u, target);
  else if(phase==='boss') renderBossPhase(u, target);
  else if(phase==='complete') renderCompletePhase(u, target);
}

  // find next unanswered question

/* ========================================================================
   通用題目輸入元件 (number / expr / mc / list)
   ======================================================================== */
function renderQuestionInput(container, q, opts){
  const state = { hintsUsed:0, resolved:false, selectedMc:null };
  const renderedAt = Date.now();

  function renderBody(){
    let inputHtml = '';
    if(q.type==='mc'){
      inputHtml = `<div class="mc-options">${q.options.map((opt,i)=>
        `<button class="mc-btn" data-idx="${i}" onclick="window.__qHandlers['${q.id}'].pick(${i})">${opt}</button>`
      ).join('')}</div>`;
} else if(q.type==='number' && q.tileChoices && q.tileChoices.length){
      inputHtml = `<div class="mc-options tile-choices">${q.tileChoices.map((val)=>
        `<button class="mc-btn tile-btn" data-val="${val}" onclick="window.__qHandlers['${q.id}'].pickTile(${val})">${val}</button>`
      ).join('')}</div>`;
} else if(q.type==='number'){
      inputHtml = `<div class="answer-row">
        <input type="number" id="input_${q.id}" placeholder="輸入答案">
        <button class="btn" onclick="window.__qHandlers['${q.id}'].submit()">送出</button>
      </div>`;
} else if(q.type==='expr'){
      inputHtml = `<div class="answer-row">
        <input type="text" id="input_${q.id}" placeholder="例如 3n-2">
        <button class="btn" onclick="window.__qHandlers['${q.id}'].submit()">送出</button>
      </div>
      <div class="helper-note">可以用 n 代表項數，例如 3n-2 或 5n+2</div>`;
} else if(q.type==='list'){
      inputHtml = `<div class="answer-row">
        <input type="text" id="input_${q.id}" placeholder="例如 1,2,3,6" style="max-width:400px;">
        <button class="btn" onclick="window.__qHandlers['${q.id}'].submit()">送出</button>
      </div>
      <div class="helper-note">請用逗號或空格分隔多個數字</div>`;
}

    const hintsHtml = q.hints && q.hints.length ? `
      <div class="hint-zone">
        ${q.hints.map((h,i)=>`<button class="hint-btn" id="hintbtn_${q.id}_${i}" onclick="window.__qHandlers['${q.id}'].showHint(${i})">提示 ${i+1}（-2 XP）</button>`).join('')}
        <div id="hintboxes_${q.id}"></div>
      </div>
    ` : '';

    container.innerHTML = `
      <div id="qbody_${q.id}">${inputHtml}</div>
      ${hintsHtml}
      <div id="feedback_${q.id}"></div>
    `;

    const inputEl = document.getElementById('input_'+q.id);
    if(inputEl){
      inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') window.__qHandlers[q.id].submit(); });
}
}

  function showHint(i){
    if(state.resolved) return;
    const btn = document.getElementById(`hintbtn_${q.id}_${i}`);
    if(btn.disabled) return;
    btn.disabled = true;
    state.hintsUsed = Math.max(state.hintsUsed, i+1);
    const box = document.getElementById('hintboxes_'+q.id);
    const div = document.createElement('div');
    div.className = 'hint-box';
    div.textContent = '💡 ' + q.hints[i];
    box.appendChild(div);
}

  function evaluate(userAnswerRaw){
    if(q.type==='number'){
      const val = parseFloat(userAnswerRaw);
      return !isNaN(val) && Math.abs(val - q.answer) < 1e-9;
}
    if(q.type==='expr'){
      return checkExprEquivalent(userAnswerRaw, q.answer);
}
    if(q.type==='list'){
      const arr = parseNumberList(userAnswerRaw);
      return arraysEqual(arr, q.answer);
}
    return false;
}

  function finalizeCorrect(){
    state.resolved = true;
    const fb = document.getElementById('feedback_'+q.id);
    let xp = opts.xpCorrect;
    xp = Math.max(2, xp - state.hintsUsed*2);
    fb.innerHTML = `<div class="feedback correct">✅ 答對了！${q.explain||q.correctMsg||''}</div>`;
    // disable inputs
    const body = document.getElementById('qbody_'+q.id);
    body.querySelectorAll('input,button').forEach(el=>el.disabled=true);
    if(q.hints){ q.hints.forEach((_,i)=>{ const b=document.getElementById(`hintbtn_${q.id}_${i}`); if(b) b.disabled=true; }); }

    registerCorrect();
    STATE.noHintTotal = (STATE.noHintTotal||0) + (state.hintsUsed===0 ? 1 : 0);
    if(STATE.noHintTotal>=5) awardBadge('nohint_bronze');
    if(STATE.noHintTotal>=15) awardBadge('nohint_silver');
    if(STATE.noHintTotal>=30) awardBadge('nohint_gold');
    saveProgress();
    if(state.hintsUsed===0 && (Date.now()-renderedAt)<=4000){ awardBadge('hidden_speed_demon'); }
    addXp(xp, opts.context==='discovery' ? '引導發現' : opts.context==='formalize' ? '正式化小測驗' : opts.context==='boss' ? '魔王試煉' : '練習題');
    if(state.hintsUsed===0 && opts.context==='practice'){
      awardBadge('no_hint_ace');
}
    if(opts.unitId){
      STATE.units[opts.unitId].hintsUsedTotal = (STATE.units[opts.unitId].hintsUsedTotal||0) + state.hintsUsed;
      saveProgress();
}
    if(opts.onCorrect) opts.onCorrect(state.hintsUsed);
}

  function markWrong(){
    registerWrong();
    const fb = document.getElementById('feedback_'+q.id);
    fb.innerHTML = `<div class="feedback wrong">🤔 再想想看，不太對喔！可以試著使用下面的提示。</div>`;
}

  function submit(){
    if(state.resolved) return;
    const inputEl = document.getElementById('input_'+q.id);
    const val = inputEl.value;
    if(!val || !val.toString().trim()){ return; }
    if(evaluate(val)) finalizeCorrect(); else markWrong();
}
  function pick(i){
    if(state.resolved) return;
    const body = document.getElementById('qbody_'+q.id);
    body.querySelectorAll('.mc-btn').forEach(b=>b.classList.remove('selected'));
    body.querySelector(`.mc-btn[data-idx="${i}"]`).classList.add('selected');
    const correct = (i === q.answer);
    if(correct){
      body.querySelector(`.mc-btn[data-idx="${i}"]`).classList.add('correct');
      finalizeCorrect();
}else{
      body.querySelector(`.mc-btn[data-idx="${i}"]`).classList.add('wrong');
      markWrong();
}
}

  window.__qHandlers = window.__qHandlers || {};
  function pickTile(val){
    if(state.resolved) return;
    const body = document.getElementById('qbody_'+q.id);
    body.querySelectorAll('.tile-btn').forEach(b=>b.classList.remove('selected'));
    const btn = body.querySelector(`.tile-btn[data-val="${val}"]`);
    if(btn) btn.classList.add('selected');
    const correct = Math.abs(val - q.answer) < 1e-9;
    if(correct){
      if(btn) btn.classList.add('correct');
      finalizeCorrect();
}else{
      if(btn) btn.classList.add('wrong');
      markWrong();
}
}
  window.__qHandlers[q.id] = { submit, pick, pickTile, showHint };
  renderBody();
}

/* ---- 小小的浮動特效：在元素旁邊冒出一個表情符號並淡出 ---- */
function spawnBurst(el, emoji){
  try{
    const rect = el.getBoundingClientRect();
    const span = document.createElement('span');
    span.textContent = emoji || '✨';
    span.style.position = 'fixed';
    span.style.left = (rect.left + rect.width/2) + 'px';
    span.style.top = rect.top + 'px';
    span.style.fontSize = '1.4rem';
    span.style.pointerEvents = 'none';
    span.style.zIndex = 500;
    span.style.transition = 'transform .6s ease, opacity .6s ease';
    document.body.appendChild(span);
    requestAnimationFrame(()=>{
      span.style.transform = 'translateY(-30px) scale(1.3)';
      span.style.opacity = '0';
    });
    setTimeout(()=>{ span.remove(); }, 650);
  }catch(e){ /* 環境不支援時安靜跳過 */ }
}


/* ---- 數線互動元件：點選數線上的位置 ---- */
function mountNumberLine(containerId, opts, onSolved){
  const container = document.getElementById(containerId);
  const min = opts.min, max = opts.max, answer = opts.answer;
  let resolved = false;
  function render(){
    let cells = '';
    for(let n=min; n<=max; n++){
      cells += `<button class="numberline-cell ${n===0?'zero':''}" data-n="${n}" onclick="window.__numlineHandlers['${containerId}'].pick(${n},this)">${n}</button>`;
    }
    container.innerHTML = `<div class="numberline-wrap"><div class="numberline-row">${cells}</div></div>`;
  }
  function pick(n, el){

}

/* ---- 籌碼抵消互動元件：點選正負籌碼互相抵消 ---- */
function mountChipCancel(containerId, opts, onSolved){
  const container = document.getElementById(containerId);
  let pos = opts.posCount, neg = opts.negCount;
  let done = false;
  function render(){
    const canCancel = pos>0 && neg>0;
    let posChips = '';
    for(let i=0;i<pos;i++){ posChips += `<div class="chip pos" onclick="window.__chipHandlers['${containerId}'].cancel()">+1</div>`; }
    let negChips = '';
    for(let i=0;i<neg;i++){ negChips += `<div class="chip neg" onclick="window.__chipHandlers['${containerId}'].cancel()">−1</div>`; }
    let resultHtml = '';
    let noteHtml = '<div class="chip-hint-note">點一下任何一個籌碼，會自動抵消一正一負</div>';
    if(!canCancel){
      const net = pos>0 ? pos : (neg>0 ? -neg : 0);
      resultHtml = `<div class="chip-result">= ${net>0?'+':''}${net}</div>`;
      noteHtml = `<div class="answer-row" style="justify-content:center;"><button class="btn" onclick="window.__chipHandlers['${containerId}'].finish()">繼續 →</button></div>`;
    }
    container.innerHTML = `
      <div class="chip-wrap">
        <div class="chip-piles">
          <div class="chip-pile">${posChips}</div>
          <div class="chip-pile">${negChips}</div>
        </div>
        ${resultHtml}
        ${noteHtml}
      </div>
    `;
  }
  function cancel(){
    if(done || pos<=0 || neg<=0) return;
    pos--; neg--;
    render();
  }
  function finish(){
    if(done) return;
    done = true;
    if(onSolved) onSolved();
  }
  window.__chipHandlers = window.__chipHandlers || {};
  window.__chipHandlers[containerId] = { cancel, finish };
  render();
}


function factorial(n){ let r=1; for(let i=2;i<=n;i++){ r*=i; } return r; }

/* ---- 排列建造元件：依序點選項目，排出指定的目標順序 ---- */
function mountLineupBuilder(containerId, opts, onSolved){
  const container = document.getElementById(containerId);
  const items = opts.items, target = opts.target;
  let slots = new Array(items.length).fill(null);
  let usedIdx = new Set();
  let resolved = false;
  function render(){
    const slotsHtml = slots.map(v=>`<div class="lineup-slot ${v!==null?'filled':''}">${v!==null?items[v]:'?'}</div>`).join('');
    const tilesHtml = items.map((it,i)=>`<button class="lineup-tile ${usedIdx.has(i)?'used':''}" ${usedIdx.has(i)?'disabled':''} onclick="window.__lineupHandlers['${containerId}'].pick(${i})">${it}</button>`).join('');
    container.innerHTML = `
      <div class="lineup-wrap">
        <div class="lineup-slots">${slotsHtml}</div>
        <div class="lineup-tiles">${tilesHtml}</div>
        <div class="answer-row" style="margin-top:10px;justify-content:center;">
          <button class="btn secondary" onclick="window.__lineupHandlers['${containerId}'].reset()">🔄 重新排列</button>
        </div>
        <div id="${containerId}_msg"></div>
      </div>
    `;
  }
  function pick(i){
    if(resolved || usedIdx.has(i)) return;
    const nextSlot = slots.findIndex(v=>v===null);
    if(nextSlot === -1) return;
    slots[nextSlot] = i;
    usedIdx.add(i);
    render();
    if(slots.every(v=>v!==null)){
      const msgEl = document.getElementById(containerId+'_msg');
      const match = slots.every((v,idx)=> items[v] === target[idx]);
      if(match){
        resolved = true;
        msgEl.innerHTML = `<div class="feedback correct">🎉 排對了！</div>`;
        if(onSolved) onSolved();
      } else {
        msgEl.innerHTML = `<div class="feedback wrong">順序不太對，點「重新排列」再試一次！</div>`;
      }
    }
  }
  function reset(){
    if(resolved) return;
    slots = new Array(items.length).fill(null);
    usedIdx = new Set();
    render();
  }
  window.__lineupHandlers = window.__lineupHandlers || {};
  window.__lineupHandlers[containerId] = { pick, reset };
  render();
}

/* ---- 排列蒐集元件：反覆排出所有可能的排列，全部找齊才過關 ---- */
function mountLineupCollector(containerId, opts, onAllFound){
  const container = document.getElementById(containerId);
  const items = opts.items;
  const total = factorial(items.length);
  let slots = new Array(items.length).fill(null);
  let usedIdx = new Set();
  const found = new Set();
  let allFoundFired = false;
  function render(){
    const slotsHtml = slots.map(v=>`<div class="lineup-slot ${v!==null?'filled':''}">${v!==null?items[v]:'?'}</div>`).join('');
    const tilesHtml = items.map((it,i)=>`<button class="lineup-tile ${usedIdx.has(i)?'used':''}" ${usedIdx.has(i)?'disabled':''} onclick="window.__lineupHandlers['${containerId}'].pick(${i})">${it}</button>`).join('');
    const galleryHtml = [...found].map(key=>{
      const order = key.split(',').map(ix=>items[ix]);
      return `<div class="lineup-found-item">${order.join(' ')}</div>`;
    }).join('');
    container.innerHTML = `
      <div class="lineup-wrap">
        <div class="lineup-progress">已找到 ${found.size} / ${total} 種排法</div>
        <div class="lineup-slots">${slotsHtml}</div>
        <div class="lineup-tiles">${tilesHtml}</div>
        <div class="answer-row" style="margin-top:10px;justify-content:center;">
          <button class="btn secondary" onclick="window.__lineupHandlers['${containerId}'].reset()">🔄 重新排列</button>
        </div>
        <div class="lineup-gallery">${galleryHtml}</div>
        <div id="${containerId}_msg"></div>
      </div>
    `;
  }
  function pick(i){
    if(usedIdx.has(i)) return;
    const nextSlot = slots.findIndex(v=>v===null);
    if(nextSlot === -1) return;
    slots[nextSlot] = i;
    usedIdx.add(i);
    if(slots.every(v=>v!==null)){
      const key = slots.join(',');
      const isNew = !found.has(key);
      found.add(key);
      render();
      const msgEl = document.getElementById(containerId+'_msg');
      msgEl.innerHTML = isNew ? `<div class="feedback correct">✨ 新排法解鎖！</div>` : `<div class="feedback info">這個排法你已經找過囉，再試試別的順序！</div>`;
      setTimeout(()=>{
        slots = new Array(items.length).fill(null);
        usedIdx = new Set();
        render();
        if(!allFoundFired && found.size === total){
          allFoundFired = true;
          if(onAllFound) onAllFound();
        }
      }, 700);
    } else {
      render();
    }
  }
  function reset(){
    slots = new Array(items.length).fill(null);
    usedIdx = new Set();
    render();
  }
  window.__lineupHandlers = window.__lineupHandlers || {};
  window.__lineupHandlers[containerId] = { pick, reset };
  render();
}

/* ---- 角度協進器元件：可拖曳或用+/-按鈕調整角度 ---- */
function mountAnglePicker(containerId, opts, onSolved){
  const container = document.getElementById(containerId);
  const target = opts.target;
  const step = opts.step || 5;
  let current = opts.start !== undefined ? opts.start : 90;
  let resolved = false;
  let dragging = false;

  function angleToXY(deg, r){
    const rad = (180-deg) * Math.PI/180;
    return { x: 100 + r*Math.cos(rad), y: 100 - r*Math.sin(rad) };
  }
  function render(){
    const p = angleToXY(current, 80);
    container.innerHTML = `
      <div class="angle-wrap">
        <svg viewBox="0 0 200 110" class="angle-svg" id="${containerId}_svg">
          <path d="M 20 100 A 80 80 0 0 1 180 100" fill="none" stroke="var(--border)" stroke-width="2"/>
          <line x1="100" y1="100" x2="180" y2="100" stroke="var(--text-dim)" stroke-width="2"/>
          <line x1="100" y1="100" x2="${p.x}" y2="${p.y}" stroke="var(--accent-teal)" stroke-width="3"/>
          <circle cx="${p.x}" cy="${p.y}" r="9" fill="var(--accent-teal)" style="cursor:pointer;" onpointerdown="window.__angleHandlers['${containerId}'].startDrag(event)"></circle>
          <circle cx="100" cy="100" r="3" fill="var(--text-dim)"/>
        </svg>
        <div class="angle-readout">目前角度：${current}°</div>
        <div class="answer-row" style="justify-content:center;gap:14px;">
          <button class="btn secondary" onclick="window.__angleHandlers['${containerId}'].stepAngle(-${step})">− ${step}°</button>
          <button class="btn secondary" onclick="window.__angleHandlers['${containerId}'].stepAngle(${step})">＋ ${step}°</button>
        </div>
        <div class="answer-row" style="justify-content:center;margin-top:8px;">
          <button class="btn" onclick="window.__angleHandlers['${containerId}'].confirm()">✅ 確認</button>
        </div>
        <div id="${containerId}_msg"></div>
      </div>
    `;
  }
  function setAngle(deg){
    if(resolved) return;
    current = Math.max(0, Math.min(180, Math.round(deg/step)*step));
    render();
  }
  function stepAngle(delta){ setAngle(current+delta); }
  function startDrag(e){
    dragging = true;
    document.addEventListener('pointermove', onDrag);
    document.addEventListener('pointerup', stopDrag);
  }
  function onDrag(e){
    if(!dragging) return;
    const svg = document.getElementById(containerId+'_svg');
    if(!svg || !svg.getBoundingClientRect) return;
    const rect = svg.getBoundingClientRect();
    if(!rect || rect.width === 0) return;
    const scaleX = 200/rect.width, scaleY = 110/rect.height;
    const x = (e.clientX-rect.left)*scaleX - 100;
    const y = 100 - (e.clientY-rect.top)*scaleY;
    let deg = Math.atan2(y, x) * 180/Math.PI;
    if(deg < 0) deg = 0;
    if(deg > 180) deg = 180;
    setAngle(deg);
  }
  function stopDrag(){
    dragging = false;
    document.removeEventListener('pointermove', onDrag);
    document.removeEventListener('pointerup', stopDrag);
  }
  function confirm(){
    if(resolved) return;
    const msgEl = document.getElementById(containerId+'_msg');
    if(current === target){
      resolved = true;
      msgEl.innerHTML = `<div class="feedback correct">🎉 對了！</div>`;
      if(onSolved) onSolved();
    } else {
      msgEl.innerHTML = `<div class="feedback wrong">還不太對，再調整看看！</div>`;
    }
  }
  window.__angleHandlers = window.__angleHandlers || {};
  window.__angleHandlers[containerId] = { setAngle, step: stepAngle, startDrag, confirm };
  render();
}

/* ---- 三角形拼接元件：調整角A、角B，即時看到角C與內角和 ---- */
function mountTriangleBuilder(containerId, opts, onSolved){
  const container = document.getElementById(containerId);
  const targetA = opts.targetA, targetB = opts.targetB;
  const step = 10;
  let A = 60, B = 60;
  let resolved = false;
  function angleC(){ return 180 - A - B; }
  function render(){
    const c = angleC();
    container.innerHTML = `
      <div class="triangle-wrap">
        <svg viewBox="0 0 200 140" class="triangle-svg">
          <polygon points="20,120 180,120 100,20" fill="rgba(45,212,191,.12)" stroke="var(--accent-teal)" stroke-width="2"/>
          <text x="20" y="135" fill="var(--text)" font-size="13" text-anchor="start">A=${A}°</text>
          <text x="180" y="135" fill="var(--text)" font-size="13" text-anchor="end">B=${B}°</text>
          <text x="100" y="15" fill="var(--text)" font-size="13" text-anchor="middle">C=${c}°</text>
        </svg>
        <div class="triangle-controls">
          <div class="triangle-ctrl-row">
            <span>角 A：${A}°</span>
            <button class="btn secondary" onclick="window.__triHandlers['${containerId}'].adjust('A',-${step})">−</button>
            <button class="btn secondary" onclick="window.__triHandlers['${containerId}'].adjust('A',${step})">＋</button>
          </div>
          <div class="triangle-ctrl-row">
            <span>角 B：${B}°</span>
            <button class="btn secondary" onclick="window.__triHandlers['${containerId}'].adjust('B',-${step})">−</button>
            <button class="btn secondary" onclick="window.__triHandlers['${containerId}'].adjust('B',${step})">＋</button>
          </div>
          <div class="triangle-sum">A + B + C = ${A} + ${B} + ${c} = ${A+B+c}°</div>
        </div>
        <div class="answer-row" style="justify-content:center;margin-top:10px;">
          <button class="btn" onclick="window.__triHandlers['${containerId}'].confirm()">✅ 確認</button>
        </div>
        <div id="${containerId}_msg"></div>
      </div>
    `;
  }
  function adjust(which, delta){
    if(resolved) return;
    let nextA = A, nextB = B;
    if(which==='A') nextA = Math.max(10, Math.min(160, A+delta));
    if(which==='B') nextB = Math.max(10, Math.min(160, B+delta));
    if(180 - nextA - nextB < 10) return;
    A = nextA; B = nextB;
    render();
  }
  function confirm(){
    if(resolved) return;
    const msgEl = document.getElementById(containerId+'_msg');
    if(A===targetA && B===targetB){
      resolved = true;
      msgEl.innerHTML = `<div class="feedback correct">🎉 對了！</div>`;
      if(onSolved) onSolved();
    } else {
      msgEl.innerHTML = `<div class="feedback wrong">再調整看看A和B的角度！</div>`;
    }
  }
  window.__triHandlers = window.__triHandlers || {};
  window.__triHandlers[containerId] = { adjust, confirm };
  render();
}

function mountSieve(containerId, min, max, onComplete, onAllTouched){
  const container = document.getElementById(containerId);
  const cellStates = {}; // num -> 'unset'|'prime'|'comp'
  for(let n=min;n<=max;n++){ cellStates[n]='unset'; }
  let completed = false;
  const touchedSet = new Set();
  let allTouchedFired = false;

  function truth(n){ return isPrime(n); }

  function render(){
    const totalCells = max-min+1;
    const setCount = Object.values(cellStates).filter(v=>v!=='unset').length;
    container.innerHTML = `
      <div class="sieve-wrap">
        <div class="sieve-legend">
          <span><span class="legend-dot unset"></span>尚未標記</span>
          <span><span class="legend-dot prime"></span>質數</span>
          <span><span class="legend-dot comp"></span>合數</span>
        </div>
        <div class="sieve-status">已標記 ${setCount} / ${totalCells} 個數字。點一下數字：第1下＝質數，第2下＝合數，第3下＝清空。全部標記正確才算過關。</div>
        <div class="sieve-grid" id="${containerId}_grid">
          ${Object.keys(cellStates).map(n=>{
            const st = cellStates[n];
            const cls = st==='prime' ? 'prime' : st==='comp' ? 'comp' : '';
            return `<button class="sieve-cell ${cls}" data-n="${n}" onclick="window.__sieveHandlers['${containerId}'].cycle(${n})">${n}</button>`;
}).join('')}
        </div>
        <div class="answer-row">
          <button class="btn secondary" onclick="window.__sieveHandlers['${containerId}'].check()">🔍 檢查進度</button>
        </div>
        <div id="${containerId}_msg"></div>
      </div>
    `;
}

  function cycle(n){
    if(completed) return;
    touchedSet.add(n);
    if(!allTouchedFired && touchedSet.size === (max-min+1)){
      allTouchedFired = true;
      if(onAllTouched) onAllTouched();
    }
    const cur = cellStates[n];
    cellStates[n] = cur==='unset' ? 'prime' : cur==='prime' ? 'comp' : 'unset';
    render();
}

  function check(){
    if(completed) return;
    let wrongCells = [];
    let unsetCount = 0;
    let allCorrect = true;
    for(const nStr of Object.keys(cellStates)){
      const n = parseInt(nStr,10);
      const st = cellStates[n];
      if(st==='unset'){ unsetCount++; allCorrect=false; continue; }
      const shouldBePrime = truth(n);
      const isCorrect = (shouldBePrime && st==='prime') || (!shouldBePrime && st==='comp');
      if(!isCorrect){ wrongCells.push(n); allCorrect=false; }
}
    const msgEl = document.getElementById(containerId+'_msg');
    if(allCorrect){
      completed = true;
      msgEl.innerHTML = `<div class="feedback correct">🎉 全部正確！做得非常好！</div>`;
      if(onComplete) onComplete();
      return;
}
    // visual feedback: pulse wrong ones, briefly
    const grid = document.getElementById(containerId+'_grid');
    wrongCells.forEach(n=>{
      const cell = grid.querySelector(`.sieve-cell[data-n="${n}"]`);
      if(cell){ cell.classList.add('pulse-wrong'); setTimeout(()=>cell.classList.remove('pulse-wrong'), 500); }
});
    let msg = '';
    if(unsetCount>0) msg += `還有 ${unsetCount} 個數字尚未標記。`;
    if(wrongCells.length>0) msg += ` 有 ${wrongCells.length} 個標記錯誤（已用紅色閃爍標示），再想想看！`;
    msgEl.innerHTML = `<div class="feedback wrong">${msg}</div>`;
}

  window.__sieveHandlers = window.__sieveHandlers || {};
  window.__sieveHandlers[containerId] = { cycle, check };
  render();
}

function celebrate(text, unitId){
  const overlay = document.createElement('div');

function runConfetti(){
  const canvas = document.getElementById('confetti-canvas');
  canvas.width = window.innerWidth; canvas.height = window.innerHeight;
  let ctx = null;
  try{ ctx = canvas.getContext('2d'); }catch(e){ ctx = null; }
  if(!ctx) return; // 環境不支援 canvas 2d 時，安靜跳過彩帶動畫，不影響其餘功能
  const colors = ['#2dd4bf','#fbbf24','#fb7185','#a78bfa','#4ade80'];
  const particles = [];
  for(let i=0;i<140;i++){
    particles.push({
            x: Math.random()*canvas.width,
            y: -20 - Math.random()*canvas.height*0.5,
            w: 6+Math.random()*6,
            h: 8+Math.random()*10,
            color: colors[Math.floor(Math.random()*colors.length)],
            speedY: 2+Math.random()*3,
            speedX: -1.5+Math.random()*3,
      rot: Math.random()*360,
      rotSpeed: -6+Math.random()*12
});
}
  let frame = 0;
  const maxFrames = 220;
  function tick(){
    frame++;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    particles.forEach(p=>{
      p.x += p.speedX; p.y += p.speedY; p.rot += p.rotSpeed;
      ctx.save();
      ctx.translate(p.x,p.y);
      ctx.rotate(p.rot*Math.PI/180);
      ctx.fillStyle = p.color;
      ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
      ctx.restore();
});
    if(frame < maxFrames){
      requestAnimationFrame(tick);
} else {
      ctx.clearRect(0,0,canvas.width,canvas.height);
}
}
  tick();
}

/* ========================================================================

   ======================================================================== */
function renderBadgeTile(b){
  const earned = STATE.badges.includes(b.id);
  const rarity = b.rarity || 'common';
  const showHiddenMystery = b.hidden && !earned;
  const icon = earned ? b.icon : (showHiddenMystery ? '❓' : '❔');
  const name = earned ? b.name : (showHiddenMystery ? '？？？' : b.name);
  const desc = earned ? b.desc : (showHiddenMystery ? '隱藏成就，解鎖後才會揭曉！' : '完成挑戰以解鎖');
  const unlockTs = STATE.badgeUnlocks && STATE.badgeUnlocks[b.id];
  const unlockDate = earned && unlockTs ? new Date(unlockTs).toLocaleDateString('zh-TW') : '';
  return `<div class="badge-tile ${earned?'earned':'locked'} rarity-${rarity}">
    <span class="bicon">${icon}</span>
    <div style="font-weight:700;">${name}</div>
    <div style="margin-top:4px;">${desc}</div>
    ${unlockDate ? `<div class="unlock-date">🗓️ ${unlockDate}</div>` : ''}
  </div>`;
}
function badgeGroups(){
  const all = Object.values(BADGES);
  const milestoneIds = ['all_boss_cleared','all_perfect','explorer_all_units'];
  const tiered = all.filter(b=>b.family);
  const milestone = all.filter(b=>milestoneIds.includes(b.id));
  const hidden = all.filter(b=>b.hidden);
  const regular = all.filter(b=>!b.family && !b.hidden && !milestoneIds.includes(b.id));
  return [
    {title:'🎖️ 單元成就', list: regular},
    {title:'📈 分級成就', list: tiered},
    {title:'🌍 里程碑成就', list: milestone},
    {title:'❓ 隱藏成就', list: hidden}
  ];
}
function openBadgeModal(){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.onclick = (e)=>{ if(e.target===backdrop) backdrop.remove(); };
  const groups = badgeGroups();
  backdrop.innerHTML = `
    <div class="modal" style="max-width:640px;">
      <h3>🏆 成就牆・獎盃室</h3>
      <p style="color:var(--text-dim);font-size:.85rem;">已獲得 ${STATE.badges.length} / ${Object.keys(BADGES).length} 個成就</p>
      ${groups.map(g => `
        <div class="achv-section-title">${g.title}</div>
        <div class="badge-grid">${g.list.map(b=>renderBadgeTile(b)).join('')}</div>
      `).join('')}
      <button class="btn secondary" style="margin-top:16px;width:100%;" onclick="this.closest('.modal-backdrop').remove()">關閉</button>

  `;

}
function openSettingsModal(){

/* ========================================================================
   匯出／匯入進度 (Export / Import Progress)
   ======================================================================== */
const PROGRESS_EXPORT_APP_ID = 'math-adventure-island';
const PROGRESS_EXPORT_SCHEMA_VERSION = 1;

function pad2(n){ return String(n).padStart(2,'0'); }
function todayDateStr(){
  const d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
}

function buildProgressExportPayload(){
  return {
    app: PROGRESS_EXPORT_APP_ID,
    schemaVersion: PROGRESS_EXPORT_SCHEMA_VERSION,
    storageKey: STORAGE_KEY,
    exportedAt: new Date().toISOString(),
    data: STATE
  };
}

function exportProgress(){
  try{
    const payload = buildProgressExportPayload();
    const json = JSON.stringify(payload, null, 2);
    const blob = new Blob([json], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `aops-progress-${todayDateStr()}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>{ try{ URL.revokeObjectURL(url); }catch(e){} }, 1000);
    showToast('📤 進度已匯出，請妥善保存檔案', 'info');
  }catch(e){
    console.warn('匯出進度失敗', e);
    showToast('匯出失敗，請稍後再試', 'wrong');
  }
}

function triggerImportProgress(){
  const input = document.getElementById('importFileInput');
  if(input){ input.value = ''; input.click(); }
}

function isValidProgressUnitShape(u){
  return !!(u && typeof u === 'object' &&
    typeof u.unlocked === 'boolean' &&
    typeof u.discoveryIndex === 'number' &&
    typeof u.practiceIndex === 'number' &&
    typeof u.practiceAnswers === 'object' &&
    typeof u.bossState === 'object');
}

// 檢查匯入的物件是否為本網站產生的合法進度檔（回傳 {ok, reason}）
function validateProgressExportPayload(obj){
  if(!obj || typeof obj !== 'object' || Array.isArray(obj)){
    return {ok:false, reason:'檔案格式不是合法的 JSON 物件'};
  }
  if(obj.app !== PROGRESS_EXPORT_APP_ID){
    return {ok:false, reason:'這不是「數學冒險島」產生的進度備份檔'};
  }
  if(!obj.data || typeof obj.data !== 'object'){
    return {ok:false, reason:'檔案缺少進度資料（data）欄位'};
  }
  const d = obj.data;
  if(typeof d.xp !== 'number' || typeof d.streak !== 'number' || !Array.isArray(d.badges)){
    return {ok:false, reason:'進度資料欄位不完整（xp / streak / badges）'};
  }
  if(!d.units || typeof d.units !== 'object'){
    return {ok:false, reason:'進度資料缺少單元（units）資訊'};
  }
  const requiredUnitIds = ['unit1','unit2','unit3','unit4','unit5','unit6','unit7','unit8'];
  for(const uid of requiredUnitIds){
    if(!isValidProgressUnitShape(d.units[uid])){
      return {ok:false, reason:`單元資料缺漏或格式錯誤：${uid}`};
    }
  }
  return {ok:true};
}

function applyImportedProgress(parsed){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(parsed.data));
  document.querySelectorAll('.modal-backdrop').forEach(m=>m.remove());
  showToast('✅ 進度已匯入，正在重新整理…', 'info');
  setTimeout(()=>{ location.reload(); }, 600);
}

function handleImportFile(event){
  const input = event && event.target;
  const file = input && input.files && input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    let parsed;
    try{
      parsed = JSON.parse(reader.result);
    }catch(e){
      showToast('❌ 檔案不是合法的 JSON，匯入失敗', 'wrong');
      return;
    }
    const check = validateProgressExportPayload(parsed);
    if(!check.ok){
      showToast('❌ ' + check.reason, 'wrong');
      return;
    }
    try{
      const existingRaw = localStorage.getItem(STORAGE_KEY);
      if(existingRaw){
        const proceed = confirm('匯入將會覆蓋目前裝置上的學習進度（等級、XP、成就與各單元記錄），此動作無法復原。確定要繼續匯入嗎？');
        if(!proceed) return;
      }
      applyImportedProgress(parsed);
    }catch(e){
      console.warn('匯入進度失敗', e);
      showToast('匯入失敗，請稍後再試', 'wrong');
    }
  };
  reader.onerror = function(){
    showToast('讀取檔案失敗，請重試', 'wrong');
  };
  reader.readAsText(file);
}

/* ========================================================================
   Init
   ======================================================================== */
function recordVisit(){
  try{
    const today = new Date().toISOString().slice(0,10);
    STATE.visitDates = STATE.visitDates || [];
    if(STATE.visitDates[STATE.visitDates.length-1] !== today){
      STATE.visitDates.push(today);
      if(STATE.visitDates.length>60) STATE.visitDates = STATE.visitDates.slice(-60);
    }
    saveProgress();
    const dates = STATE.visitDates.map(d=>new Date(d+'T00:00:00').getTime()).sort((a,b)=>a-b);
    let run = 1, best = 1;
    for(let i=1;i<dates.length;i++){
      const diffDays = Math.round((dates[i]-dates[i-1])/86400000);
      if(diffDays===1){ run++; best=Math.max(best,run); }
      else if(diffDays>1){ run=1; }
    }
    if(best>=3) awardBadge('hidden_login_streak');
  }catch(e){ /* 安靜跳過 */ }
}
window.addEventListener('DOMContentLoaded', ()=>{
  loadProgress();
  recordVisit();
  checkMilestones();
  updateHeaderStats();
  renderHome();
});
