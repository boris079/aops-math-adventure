<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
    <title>數學冒險島｜國一代數與數論探索</title>
  <style>
    :root{
        --bg-1:#151233;
        --bg-2:#1d1a45;
        --panel:#242058;
        --panel-2:#2b276b;
        --panel-light:#33308a;
        --border:#4a45a3;
        --text:#f1efff;
        --text-dim:#b8b3e8;
        --accent-teal:#2dd4bf;
        --accent-amber:#fbbf24;
        --accent-coral:#fb7185;
        --accent-purple:#a78bfa;
        --accent-green:#4ade80;
        --accent-red:#f87171;
        --radius:16px;
        --shadow: 0 8px 24px rgba(0,0,0,0.35);
    }
    *{box-sizing:border-box;}
    html,body{margin:0;padding:0;}
    body{
        font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
        background: radial-gradient(circle at 20% 0%, #2a2570 0%, var(--bg-1) 55%) fixed;
        color:var(--text);
        min-height:100vh;
        -webkit-font-smoothing:antialiased;
    }
    #app{max-width:980px;margin:0 auto;padding:0 16px 80px;}
    a{color:inherit;}
    button{font-family:inherit;cursor:pointer;}
    .hidden{display:none !important;}

    /* ---------- Header ---------- */
    header.topbar{
        position:sticky;top:0;z-index:50;
        background:linear-gradient(135deg,#201c52,#2a2570);
        border-bottom:1px solid var(--border);
        padding:10px 16px;
        display:flex;align-items:center;gap:14px;flex-wrap:wrap;
        box-shadow:var(--shadow);
    }
    .topbar .brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;letter-spacing:.5px;cursor:pointer;flex-shrink:0;}
    .topbar .brand .logo-emoji{font-size:1.4rem;}
    .topbar .spacer{flex:1;}
    .stat-pill{
        display:flex;align-items:center;gap:6px;
        background:rgba(255,255,255,.06);
        border:1px solid var(--border);
        border-radius:999px;
        padding:5px 12px;
        font-size:.82rem;font-weight:700;white-space:nowrap;
    }
    .level-badge{
        background:linear-gradient(135deg,var(--accent-purple),#7c3aed);
        border-radius:999px;width:30px;height:30px;
        display:flex;align-items:center;justify-content:center;
        font-weight:800;font-size:.78rem;flex-shrink:0;
        box-shadow:0 0 0 2px rgba(167,139,250,.35);
    }
    .xp-bar-wrap{width:110px;height:8px;background:rgba(255,255,255,.12);border-radius:999px;overflow:hidden;flex-shrink:0;}
    .xp-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent-teal),var(--accent-purple));border-radius:999px;transition:width .4s ease;}
    .streak-pill{color:var(--accent-amber);}
    .streak-pill.hot{animation:pulseHot 1s infinite;}
    @keyframes pulseHot{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}
    .icon-btn{
        background:rgba(255,255,255,.06);border:1px solid var(--border);border-radius:10px;
        width:36px;height:36px;display:flex;align-items:center;justify-content:center;
        font-size:1.1rem;color:var(--text);flex-shrink:0;
    }
    .icon-btn:hover{background:rgba(255,255,255,.14);}

    /* ---------- Layout / Cards ---------- */
    .screen{padding-top:20px;animation:fadeIn .35s ease;}
    @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
    h1.page-title{font-size:1.5rem;margin:6px 0 4px;}
    p.page-sub{color:var(--text-dim);margin:0 0 20px;font-size:.95rem;}

    .unit-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
    @media (max-width:680px){.unit-grid{grid-template-columns:1fr;}}
    .unit-card{
        background:linear-gradient(160deg,var(--panel),var(--panel-2));
        border:1px solid var(--border);border-radius:var(--radius);
        padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden;
        transition:transform .15s ease;
    }
    .unit-card:not(.locked):hover{transform:translateY(-3px);}
    .unit-card.locked{opacity:.55;filter:grayscale(.4);}
    .unit-card .unit-icon{font-size:2.2rem;}
    .unit-card h3{margin:10px 0 4px;font-size:1.15rem;}
    .unit-card p{color:var(--text-dim);font-size:.87rem;margin:0 0 14px;line-height:1.5;}
    .progress-track{height:10px;background:rgba(255,255,255,.1);border-radius:999px;overflow:hidden;margin-bottom:8px;}
    .progress-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,var(--accent-teal),var(--accent-green));transition:width .4s ease;}
    .unit-meta{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text-dim);}
    .stars{color:var(--accent-amber);letter-spacing:2px;font-size:.9rem;}
    .unit-cta{
        margin-top:14px;display:inline-flex;align-items:center;gap:6px;
        background:linear-gradient(135deg,var(--accent-teal),#0ea5a5);
        color:#062a28;font-weight:800;border:none;border-radius:10px;
        padding:9px 16px;font-size:.88rem;
    }
    .unit-cta:hover{filter:brightness(1.08);}
    .lock-overlay{position:absolute;top:14px;right:14px;font-size:1.3rem;}

    .badges-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;}
    .badge-chip{
        display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.05);
        border:1px solid var(--border);border-radius:999px;padding:6px 12px;font-size:.8rem;color:var(--text-dim);
    }
    .badge-chip.earned{color:var(--text);border-color:var(--accent-amber);background:rgba(251,191,36,.08);}

    /* ---------- Unit flow ---------- */
    .unit-header{display:flex;align-items:center;gap:10px;margin-bottom:6px;flex-wrap:wrap;}
    .back-btn{
        background:none;border:1px solid var(--border);color:var(--text-dim);
        border-radius:8px;padding:6px 10px;font-size:.82rem;
    }
    .back-btn:hover{color:var(--text);}
    .phase-stepper{display:flex;gap:6px;margin:14px 0 22px;flex-wrap:wrap;}
    .phase-dot{
        flex:1;min-width:60px;text-align:center;padding:8px 4px;border-radius:10px;
        font-size:.72rem;font-weight:700;background:rgba(255,255,255,.05);
        color:var(--text-dim);border:1px solid transparent;
    }
    .phase-dot.active{background:rgba(45,212,191,.15);color:var(--accent-teal);border-color:var(--accent-teal);}
    .phase-dot.done{color:var(--accent-green);}

    .card{
        background:linear-gradient(160deg,var(--panel),var(--panel-2));
        border:1px solid var(--border);border-radius:var(--radius);
        padding:22px;box-shadow:var(--shadow);margin-bottom:18px;
    }
    .tag{
        display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.5px;
        padding:4px 10px;border-radius:999px;margin-bottom:12px;
    }
    .tag.hook{background:rgba(251,113,133,.15);color:var(--accent-coral);}
    .tag.discovery{background:rgba(45,212,191,.15);color:var(--accent-teal);}
    .tag.formalize{background:rgba(167,139,250,.15);color:var(--accent-purple);}
    .tag.practice{background:rgba(251,191,36,.15);color:var(--accent-amber);}
    .tag.boss{background:rgba(248,113,113,.18);color:var(--accent-red);}

    .prompt-text{font-size:1.08rem;line-height:1.75;margin-bottom:16px;}
    .prompt-text b{color:var(--accent-amber);}
    .helper-note{font-size:.82rem;color:var(--text-dim);margin:-8px 0 14px;}
    .answer-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
    input[type=text],input[type=number]{
        background:rgba(0,0,0,.25);border:1.5px solid var(--border);border-radius:10px;
        color:var(--text);padding:10px 14px;font-size:1rem;min-width:0;flex:1;max-width:280px;
    }
    input[type=text]:focus,input[type=number]:focus{outline:none;border-color:var(--accent-teal);}
    .btn{
        border:none;border-radius:10px;padding:10px 18px;font-weight:800;font-size:.9rem;
        background:linear-gradient(135deg,var(--accent-teal),#0ea5a5);color:#062a28;
    }
    .btn:hover{filter:brightness(1.08);}
    .btn:disabled{opacity:.4;cursor:not-allowed;filter:none;}
    .btn.secondary{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--border);}
    .btn.ghost{background:transparent;color:var(--accent-teal);border:1px solid var(--accent-teal);}
    .btn.warn{background:linear-gradient(135deg,var(--accent-coral),#e11d48);color:#3a0512;}
    .mc-options{display:flex;flex-direction:column;gap:10px;margin-bottom:10px;}
    .mc-btn{
        text-align:left;background:rgba(255,255,255,.04);border:1.5px solid var(--border);
        border-radius:12px;padding:12px 16px;color:var(--text);font-size:.95rem;
    }
    .mc-btn:hover{border-color:var(--accent-teal);}
    .mc-btn.selected{border-color:var(--accent-purple);background:rgba(167,139,250,.12);}
    .mc-btn.correct{border-color:var(--accent-green);background:rgba(74,222,128,.14);}
    .mc-btn.wrong{border-color:var(--accent-red);background:rgba(248,113,113,.14);}

    .feedback{
        margin-top:12px;padding:12px 16px;border-radius:12px;font-size:.9rem;line-height:1.6;
        animation:fadeIn .25s ease;
    }
    .feedback.correct{background:rgba(74,222,128,.12);border:1px solid var(--accent-green);color:#c9f7d5;}
    .feedback.wrong{background:rgba(248,113,113,.1);border:1px solid var(--accent-red);color:#ffd7d5;}
    .feedback.info{background:rgba(167,139,250,.1);border:1px solid var(--accent-purple);color:#e5deff;}

    .hint-zone{margin-top:14px;}
    .hint-btn{
        background:rgba(251,191,36,.1);border:1px dashed var(--accent-amber);color:var(--accent-amber);
        border-radius:10px;padding:8px 14px;font-size:.82rem;margin:4px 6px 0 0;
    }
    .hint-btn:hover{background:rgba(251,191,36,.2);}
    .hint-btn:disabled{opacity:.35;}
    .hint-box{
        background:rgba(255,255,255,.05);border-left:3px solid var(--accent-amber);
        padding:10px 14px;border-radius:8px;margin-top:8px;font-size:.86rem;color:var(--text-dim);
    }

    .step-progress-label{font-size:.78rem;color:var(--text-dim);margin-bottom:10px;}
    .formalize-block h4{color:var(--accent-purple);margin:18px 0 6px;font-size:1rem;}
    .formalize-block h4:first-child{margin-top:0;}
    .formula-box{
        background:rgba(0,0,0,.25);border:1px solid var(--accent-purple);border-radius:12px;
        padding:14px 18px;font-size:1.1rem;text-align:center;margin:10px 0;color:var(--accent-purple);font-weight:800;
    }

    /* ---------- Sieve grid ---------- */
    .sieve-wrap{margin-top:10px;}
    .sieve-legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--text-dim);margin-bottom:12px;}
    .sieve-legend span{display:inline-flex;align-items:center;gap:5px;}
    .legend-dot{width:14px;height:14px;border-radius:50%;display:inline-block;}
    .legend-dot.prime{background:var(--accent-green);}
    .legend-dot.comp{background:var(--accent-red);}
    .legend-dot.unset{background:rgba(255,255,255,.2);}
    .sieve-grid{
        display:grid;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:6px;margin-bottom:14px;
    }
    .sieve-cell{
        aspect-ratio:1;display:flex;align-items:center;justify-content:center;
        background:rgba(255,255,255,.06);border:1.5px solid var(--border);border-radius:8px;
        font-size:.82rem;font-weight:700;color:var(--text);position:relative;
    }
    .sieve-cell.prime{background:rgba(74,222,128,.18);border-color:var(--accent-green);color:#c9f7d5;}
    .sieve-cell.comp{background:rgba(248,113,113,.12);border-color:var(--accent-red);color:#ffd7d5;text-decoration:line-through;}
    .sieve-cell.pulse-wrong{animation:shakeWrong .4s ease;}
    .sieve-cell.pulse-right{animation:popRight .4s ease;}
    @keyframes shakeWrong{0%,100%{transform:translateX(0);}25%{transform:translateX(-3px);}75%{transform:translateX(3px);}}
    @keyframes popRight{0%{transform:scale(1);}50%{transform:scale(1.15);}100%{transform:scale(1);}}
    .sieve-status{font-size:.85rem;color:var(--text-dim);margin-bottom:10px;}
    .pulse-attn{animation:pulseAttn 1s ease-in-out 3;box-shadow:0 0 0 3px rgba(251,191,36,.6);}
    @keyframes pulseAttn{0%,100%{transform:scale(1);filter:brightness(1);}50%{transform:scale(1.08);filter:brightness(1.25);}}

    /* ---------- Boss ---------- */
    .boss-frame{
        border:2px solid var(--accent-red);border-radius:var(--radius);
        background:radial-gradient(circle at 30% 0%,rgba(248,113,113,.12),transparent 60%),linear-gradient(160deg,var(--panel),var(--panel-2));
        padding:24px;
    }
    .boss-title{font-size:1.3rem;font-weight:900;color:var(--accent-red);display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .boss-part{border-top:1px dashed var(--border);padding-top:16px;margin-top:16px;}
    .boss-part:first-of-type{border-top:none;margin-top:0;}
    .boss-part-label{font-size:.8rem;color:var(--accent-amber);font-weight:800;margin-bottom:6px;}
    /* ---------- Practice question index chips ---------- */
    .qchip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;}
    .qchip{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;
             font-size:.72rem;font-weight:800;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--text-dim);}
    .qchip.correct{background:rgba(74,222,128,.2);border-color:var(--accent-green);color:#c9f7d5;}
    .qchip.current{border-color:var(--accent-teal);color:var(--accent-teal);}

    /* ---------- Toast ---------- */
    #toast-stack{position:fixed;top:70px;right:16px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:280px;}
    .toast{
        background:linear-gradient(135deg,#242058,#33308a);border:1px solid var(--accent-teal);
        border-radius:12px;padding:10px 14px;font-size:.85rem;box-shadow:var(--shadow);
        animation:toastIn .3s ease, toastOut .3s ease 2.7s forwards;
    }
    .toast.badge{border-color:var(--accent-amber);}
    .toast.level{border-color:var(--accent-purple);}
    @keyframes toastIn{from{opacity:0;transform:translateX(30px);}to{opacity:1;transform:translateX(0);}}
    @keyframes toastOut{to{opacity:0;transform:translateX(30px);}}

    /* ---------- Modal ---------- */
    .modal-backdrop{
        position:fixed;inset:0;background:rgba(10,8,30,.75);z-index:300;
        display:flex;align-items:center;justify-content:center;padding:20px;
    }
    .modal{
        background:linear-gradient(160deg,var(--panel),var(--panel-2));border:1px solid var(--border);
        border-radius:var(--radius);padding:24px;max-width:480px;width:100%;max-height:85vh;overflow:auto;
        box-shadow:var(--shadow);
    }
    .modal h3{margin-top:0;}
    .badge-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:14px;}
    .badge-tile{
        background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:12px;
        padding:12px;text-align:center;font-size:.78rem;color:var(--text-dim);
    }
    .badge-tile.earned{border-color:var(--accent-amber);color:var(--text);background:rgba(251,191,36,.08);}
    .badge-tile .bicon{font-size:1.8rem;display:block;margin-bottom:6px;}

    /* ---------- Celebration ---------- */
    #celebrate-overlay{
        position:fixed;inset:0;z-index:400;display:flex;align-items:center;justify-content:center;
        background:rgba(8,6,24,.85);
    }
    .celebrate-card{
        text-align:center;background:linear-gradient(160deg,#2b276b,#1d1a45);border:2px solid var(--accent-amber);
        border-radius:20px;padding:36px 30px;max-width:420px;width:92%;box-shadow:0 0 60px rgba(251,191,36,.25);
        animation:celebratePop .4s cubic-bezier(.34,1.56,.64,1);
    }
    @keyframes celebratePop{from{transform:scale(.7);opacity:0;}to{transform:scale(1);opacity:1;}}
    .celebrate-card .big-emoji{font-size:3.2rem;}
    .celebrate-card h2{margin:8px 0 4px;color:var(--accent-amber);}
    .celebrate-card p{color:var(--text-dim);font-size:.9rem;}
    #confetti-canvas{position:fixed;inset:0;z-index:399;pointer-events:none;}

    footer.site-footer{text-align:center;color:var(--text-dim);font-size:.75rem;padding:30px 0 10px;}

    @media (max-width:520px){
        .stat-pill{padding:4px 8px;font-size:.74rem;}
        .xp-bar-wrap{width:70px;}
        .celebrate-card{padding:26px 18px;}
    }
    </style>
  </head>
  <body>
    
  <header class="topbar">
      <div class="brand" onclick="goHome()"><span class="logo-emoji">🎓</span><span>數學冒險島</span></div>
        <div class="spacer"></div>
          <div class="stat-pill streak-pill" id="streakPill">🔥 0</div>
                            <div class="stat-pill"><div class="level-badge" id="levelBadge">Lv1</div><div class="xp-bar-wrap"><div class="xp-bar-fill" id="xpBarFill" style="width:0%"></div></div></div>
                              <button class="icon-btn" title="我的徽章" onclick="openBadgeModal()">🏅</button>
      <button class="icon-btn" title="設定" onclick="openSettingsModal()">⚙️</button>

  </header>

    <div id="app"></div>
    <div id="toast-stack"></div>

    <footer class="site-footer">為國一數學打基礎而生・引導式發現學習法</footer>

    <canvas id="confetti-canvas"></canvas>

    <script>/* ========================================================================
       數學冒險島 - 資料層 (Data Layer)
       ======================================================================== */
    
    const STORAGE_KEY = 'mathAdventureProgress_v1';
    
    const BADGES = {
        unit1_discoverer: {id:'unit1_discoverer', name:'代數探險家', desc:'完成單元一的引導發現', icon:'🧭'},
        unit2_discoverer: {id:'unit2_discoverer', name:'數論偵探', desc:'完成單元二的引導發現', icon:'🔎'},
        no_hint_ace:       {id:'no_hint_ace', name:'免提示達人', desc:'不看提示答對一題', icon:'💡'},
        streak5:           {id:'streak5', name:'五連勝', desc:'連續答對 5 題', icon:'🔥'},
        streak10:          {id:'streak10', name:'十連勝火焰', desc:'連續答對 10 題', icon:'⚡'},
        boss1:             {id:'boss1', name:'代數魔王擊破', desc:'通過單元一魔王挑戰', icon:'🏆'},
        boss2:             {id:'boss2', name:'質數魔王擊破', desc:'通過單元二魔王挑戰', icon:'👑'},
        sieve_master:      {id:'sieve_master', name:'篩法大師', desc:'完成 100 以內的質數篩選', icon:'🕸️'},
        perfect1:          {id:'perfect1', name:'單元一・完美通關', desc:'單元一全程零提示', icon:'🌟'},
        perfect2:          {id:'perfect2', name:'單元二・完美通關', desc:'單元二全程零提示', icon:'🌟'}
    };
    
    // ---- 工具：算式檢查 (以數值代入比對，容忍各種等價寫法) ----
    function safeEvalExpr(expr, n){
        const cleaned = expr.replace(/\s+/g,'').replace(/×/g,'*').replace(/x/gi,'n');
        if(!/^[0-9n+\-*/().]+$/i.test(cleaned)) return null;
        // 支援 3n 這種省略乘號寫法 -> 3*n
      const withMul = cleaned.replace(/(\d)(n)/gi,'$1*$2').replace(/(n)(\d)/gi,'$1*$2').replace(/(n)\(/gi,'$1*(').replace(/\)(n)/gi,')*$1').replace(/\)(\d)/g,')*$1').replace(/(\d)\(/g,'$1*(');
        try{
              // eslint-disable-next-line no-new-func
          const fn = new Function('n', 'return (' + withMul + ');');
              const v = fn(n);
              return (typeof v === 'number' && isFinite(v)) ? v : null;
        }catch(e){ return null; }
    }
    function checkExprEquivalent(userExpr, expectedExpr){
        if(!userExpr || !userExpr.trim()) return false;
        const testPoints = [1,2,5,7,11];
        for(const n of testPoints){
              const a = safeEvalExpr(userExpr, n);
              const b = safeEvalExpr(expectedExpr, n);
              if(a===null || b===null) return false;
              if(Math.abs(a-b) > 1e-9) return false;
        }
        return true;
    }
    function parseNumberList(str){
        if(!str) return [];
        return str.split(/[,，、\s]+/).map(s=>s.trim()).filter(s=>s.length>0).map(Number).filter(n=>!isNaN(n)).sort((a,b)=>a-b);
    }
    function arraysEqual(a,b){
        if(a.length!==b.length) return false;
        for(let i=0;i<a.length;i++){ if(a[i]!==b[i]) return false; }
        return true;
    }
    function isPrime(num){
        if(num < 2) return false;
        for(let i=2;i*i<=num;i++){ if(num % i === 0) return false; }
        return true;
    }
    
    /* ========================================================================
       單元一：代數式與變數的探索
       ======================================================================== */
    const UNIT1 = {
        id:'unit1',

            return;

  /* ========================================================================
       通用題目輸入元件 (number / expr / mc / list)
     ======================================================================== */
  function renderQuestionInput(container, q, opts){
    const state = { hintsUsed:0, resolved:false, selectedMc:null, wrongCount:0 };
  
    function renderBody(){
      let inputHtml = '';
      if(q.type==='mc'){
          inputHtml = `<div class="mc-options">${q.options.map((opt,i)=>
          `<button class="mc-btn" data-idx="${i}" onclick="window.__qHandlers['${q.id}'].pick(${i})">${opt}</button>`
        ).join('')}</div>`;
      } else if(q.type==='number'){
          inputHtml = `<div class="answer-row">
          <input type="number" id="input_${q.id}" placeholder="輸入答案">
          <button class="btn" onclick="window.__qHandlers['${q.id}'].submit()">送出</button>
        </div>`;
        } else if(q.type==='expr'){
        inputHtml = `<div class="answer-row">
          <input type="text" id="input_${q.id}" placeholder="例如 3n-2">
          <button class="btn" onclick="window.__qHandlers['${q.id}'].submit()">送出</button>
  </div>
        <div class="helper-note">可以用 n 代表項數，例如 3n-2 或 5n+2</div>`;
        } else if(q.type==='list'){
        inputHtml = `<div class="answer-row">
          <input type="text" id="input_${q.id}" placeholder="例如 1,2,3,6" style="max-width:400px;">
          <button class="btn" onclick="window.__qHandlers['${q.id}'].submit()">送出</button>
  </div>
        <div class="helper-note">請用逗號或空格分隔多個數字</div>`;
  }
  
        const hintsHtml = q.hints && q.hints.length ? `
        <div class="hint-zone">
            ${q.hints.map((h,i)=>`<button class="hint-btn" id="hintbtn_${q.id}_${i}" onclick="window.__qHandlers['${q.id}'].showHint(${i})">提示 ${i+1}（-2 XP）</button>`).join('')}
                    <div id="hintboxes_${q.id}"></div>
          </div>
              ` : '';
                   
      container.innerHTML = `
        <div id="qbody_${q.id}">${inputHtml}</div>
          ${hintsHtml}
          <div id="feedback_${q.id}"></div>
                     `;
  
                const inputEl = document.getElementById('input_'+q.id);
        if(inputEl){
          inputEl.addEventListener('keydown', (e)=>{ if(e.key==='Enter') window.__qHandlers[q.id].submit(); });
      }
      }
    
      function showHint(i){
        if(state.resolved) return;
        const btn = document.getElementById(`hintbtn_${q.id}_${i}`);
        if(btn.disabled) return;
        btn.disabled = true;
        btn.classList.remove('pulse-attn');
        state.hintsUsed = Math.max(state.hintsUsed, i+1);
            const box = document.getElementById('hintboxes_'+q.id);
                     const div = document.createElement('div');
            div.className = 'hint-box';
            div.textContent = '💡 ' + q.hints[i];
            box.appendChild(div);
      }
    
      function evaluate(userAnswerRaw){
            if(q.type==='number'){
                    const val = parseFloat(userAnswerRaw);
                    return !isNaN(val) && Math.abs(val - q.answer) < 1e-9;
            }
            if(q.type==='expr'){
                    return checkExprEquivalent(userAnswerRaw, q.answer);
            }
            if(q.type==='list'){
                    const arr = parseNumberList(userAnswerRaw);
                    return arraysEqual(arr, q.answer);
            }
            return false;
      }
    
      function finalizeCorrect(){
            state.resolved = true;
            const fb = document.getElementById('feedback_'+q.id);
            let xp = opts.xpCorrect;
            xp = Math.max(2, xp - state.hintsUsed*2);
            fb.innerHTML = `<div class="feedback correct">✅ 答對了！${q.explain||q.correctMsg||''}</div>`;
            // disable inputs
        const body = document.getElementById('qbody_'+q.id);
            body.querySelectorAll('input,button').forEach(el=>el.disabled=true);
            if(q.hints){ q.hints.forEach((_,i)=>{ const b=document.getElementById(`hintbtn_${q.id}_${i}`); if(b) b.disabled=true; }); }
        
        registerCorrect();
            addXp(xp, opts.context==='discovery' ? '引導發現' : opts.context==='formalize' ? '正式化小測驗' : opts.context==='boss' ? '魔王試煉' : '練習題');
            if(state.hintsUsed===0 && opts.context==='practice'){
                    awardBadge('no_hint_ace');
            }
            if(opts.unitId){
                    STATE.units[opts.unitId].hintsUsedTotal = (STATE.units[opts.unitId].hintsUsedTotal||0) + state.hintsUsed;
                    saveProgress();
            }
            if(opts.onCorrect) opts.onCorrect(state.hintsUsed);
      }
    
      function markWrong(){
            registerWrong();
            state.wrongCount = (state.wrongCount||0) + 1;
            const fb = document.getElementById('feedback_'+q.id);
              if(state.wrongCount >= 2 && q.hints && q.hints.length){
                      fb.innerHTML = `<div class="feedback wrong">🤔 再想想看，不太對喔！別擔心，卡住是很正常的——按下面「提示」按鈕，會一步步帶你找到方向。</div>`;
                      const nextHintIdx = Math.min(state.hintsUsed, q.hints.length-1);
                      const nextBtn = document.getElementById(`hintbtn_${q.id}_${nextHintIdx}`);
                      if(nextBtn && !nextBtn.disabled){ nextBtn.classList.add('pulse-attn'); }
              } else {
                      fb.innerHTML = `<div class="feedback wrong">🤔 再想想看，不太對喔！可以試著使用下面的提示。</div>`;
              }
      }
    
      function submit(){
            if(state.resolved) return;
            const inputEl = document.getElementById('input_'+q.id);
            const val = inputEl.value;
            if(!val || !val.toString().trim()){ return; }
            if(evaluate(val)) finalizeCorrect(); else markWrong();
      }
      function pick(i){
            if(state.resolved) return;
      const body = document.getElementById('qbody_'+q.id);
      body.querySelectorAll('.mc-btn').forEach(b=>b.classList.remove('selected'));
      body.querySelector(`.mc-btn[data-idx="${i}"]`).classList.add('selected');
      const correct = (i === q.answer);
      if(correct){
        body.querySelector(`.mc-btn[data-idx="${i}"]`).classList.add('correct');
        finalizeCorrect();
        }else{
          body.querySelector(`.mc-btn[data-idx="${i}"]`).classList.add('wrong');
        markWrong();
      }
    }
    
    window.__qHandlers = window.__qHandlers || {};
    window.__qHandlers[q.id] = { submit, pick, showHint };
    renderBody();
  }
    
    /* ========================================================================
     質數篩選互動元件 (Sieve of Eratosthenes)
     ======================================================================== */
  function mountSieve(containerId, min, max, onComplete){
        const container = document.getElementById(containerId);
    const cellStates = {}; // num -> 'unset'|'prime'|'comp'
      for(let n=min;n<=max;n++){ cellStates[n]='unset'; }
    let completed = false;
    
    function truth(n){ return isPrime(n); }
  
      function render(){
      const totalCells = max-min+1;
        const setCount = Object.values(cellStates).filter(v=>v!=='unset').length;
        container.innerHTML = `
        <div class="sieve-wrap">
          <div class="sieve-legend">
            <span><span class="legend-dot unset"></span>尚未標記</span>
            <span><span class="legend-dot prime"></span>質數</span>
            <span><span class="legend-dot comp"></span>合數</span>
  </div>
          <div class="sieve-status">已標記 ${setCount} / ${totalCells} 個數字。點一下數字：第1下＝質數，第2下＝合數，第3下＝清空。全部標記正確才算過關。</div>
          <div class="sieve-grid" id="${containerId}_grid">
              ${Object.keys(cellStates).map(n=>{
              const st = cellStates[n];
              const cls = st==='prime' ? 'prime' : st==='comp' ? 'comp' : '';
              return `<button class="sieve-cell ${cls}" data-n="${n}" onclick="window.__sieveHandlers['${containerId}'].cycle(${n})">${n}</button>`;
              }).join('')}
  </div>
          <div class="answer-row">
            <button class="btn secondary" onclick="window.__sieveHandlers['${containerId}'].check()">🔍 檢查進度</button>
            <button class="btn secondary" onclick="window.__sieveHandlers['${containerId}'].hint()">💡 給我一個提示</button>
  </div>
          <div id="${containerId}_msg"></div>
        </div>
      `;
    }
  
    function cycle(n){
        if(completed) return;
      const cur = cellStates[n];
      cellStates[n] = cur==='unset' ? 'prime' : cur==='prime' ? 'comp' : 'unset';
      render();
    }
  
      function check(){
      if(completed) return;
      let wrongCells = [];
      let unsetCount = 0;
      let allCorrect = true;
      for(const nStr of Object.keys(cellStates)){
        const n = parseInt(nStr,10);
        const st = cellStates[n];
        if(st==='unset'){ unsetCount++; allCorrect=false; continue; }
        const shouldBePrime = truth(n);
        const isCorrect = (shouldBePrime && st==='prime') || (!shouldBePrime && st==='comp');
        if(!isCorrect){ wrongCells.push(n); allCorrect=false; }
      }
      const msgEl = document.getElementById(containerId+'_msg');
      if(allCorrect){
        completed = true;
        msgEl.innerHTML = `<div class="feedback correct">🎉 全部正確！做得非常好！</div>`;
          if(onComplete) onComplete();
        return;
      }
      // visual feedback: pulse wrong ones, briefly
      const grid = document.getElementById(containerId+'_grid');
      wrongCells.forEach(n=>{
        const cell = grid.querySelector(`.sieve-cell[data-n="${n}"]`);
        if(cell){ cell.classList.add('pulse-wrong'); setTimeout(()=>cell.classList.remove('pulse-wrong'), 500); }
      });
      let msg = '';
        if(unsetCount>0) msg += `還有 ${unsetCount} 個數字尚未標記。`;
        if(wrongCells.length>0) msg += ` 有 ${wrongCells.length} 個標記錯誤（已用紅色閃爍標示），再想想看！`;
        msgEl.innerHTML = `<div class="feedback wrong">${msg}</div>`;
  }
  
    function hint(){
      if(completed) return;
      const msgEl = document.getElementById(containerId+'_msg');
        // 優先找還沒標記的數字；如果都標記了，找標記錯誤的數字
      let target = null;
      for(const nStr of Object.keys(cellStates)){
        if(cellStates[nStr]==='unset'){ target = parseInt(nStr,10); break; }
  }
      if(target===null){
        for(const nStr of Object.keys(cellStates)){
          const n = parseInt(nStr,10);
          const st = cellStates[n];
          const shouldBePrime = truth(n);
            const isCorrect = (shouldBePrime && st==='prime') || (!shouldBePrime && st==='comp');
          if(!isCorrect){ target = n; break; }
          }
      }
      if(target===null){
          msgEl.innerHTML = `<div class="feedback correct">目前看起來都標記好囉，按「檢查進度」看看吧！</div>`;
        return;
        }
      const grid = document.getElementById(containerId+'_grid');
        const cell = grid.querySelector(`.sieve-cell[data-n="${target}"]`);
          if(cell){ cell.classList.add('pulse-attn'); setTimeout(()=>cell.classList.remove('pulse-attn'), 2200); }
                               if(target===1){
            msgEl.innerHTML = `<div class="hint-box">💡 先想想 1 特別在哪裡：它只有自己一個因數，所以規定 1 既不是質數、也不是合數（通常篩選範圍會從2開始，你可以先跳過1）。</div>`;
        return;
        }
                let divisorFound = null;
          for(let d=2; d*d<=target; d++){
                      if(target % d === 0){ divisorFound = d; break; }
                }
                     if(divisorFound){
          msgEl.innerHTML = `<div class="hint-box">💡 試試看：${target} 可以被 ${divisorFound} 整除嗎？${target} ÷ ${divisorFound} = ${target/divisorFound}，剛好除盡，所以 ${target} 除了1和自己之外還有別的因數，是「合數」。</div>`;
      } else {
          msgEl.innerHTML = `<div class="hint-box">💡 試試看：把 ${target} 除以比它小的質數（2、3、5、7……），只要試到某個數字的平方剛好超過 ${target} 就可以停了。你會發現都除不盡，所以 ${target} 是「質數」。</div>`;
  }
    }
    
    window.__sieveHandlers = window.__sieveHandlers || {};
    window.__sieveHandlers[containerId] = { cycle, check, hint };
    render();
  }

  function celebrate(text, unitId){
    const overlay = document.createElement('div');

    function runConfetti(){
      const canvas = document.getElementById('confetti-canvas');
      canvas.width = window.innerWidth; canvas.height = window.innerHeight;
    let ctx = null;
      try{ ctx = canvas.getContext('2d'); }catch(e){ ctx = null; }
    if(!ctx) return; // 環境不支援 canvas 2d 時，安靜跳過彩帶動畫，不影響其餘功能
    const colors = ['#2dd4bf','#fbbf24','#fb7185','#a78bfa','#4ade80'];
    const particles = [];
    for(let i=0;i<140;i++){
      particles.push({
          x: Math.random()*canvas.width,
        y: -20 - Math.random()*canvas.height*0.5,
        w: 6+Math.random()*6,
        h: 8+Math.random()*10,
          color: colors[Math.floor(Math.random()*colors.length)],
          speedY: 2+Math.random()*3,
        speedX: -1.5+Math.random()*3,
        rot: Math.random()*360,
        rotSpeed: -6+Math.random()*12
        });
      }
      let frame = 0;
    const maxFrames = 220;
      function tick(){
      frame++;
      ctx.clearRect(0,0,canvas.width,canvas.height);
      particles.forEach(p=>{
        p.x += p.speedX; p.y += p.speedY; p.rot += p.rotSpeed;
        ctx.save();
        ctx.translate(p.x,p.y);
        ctx.rotate(p.rot*Math.PI/180);
              ctx.fillStyle = p.color;
        ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);
        ctx.restore();
        });
      if(frame < maxFrames){
        requestAnimationFrame(tick);
        } else {
        ctx.clearRect(0,0,canvas.width,canvas.height);
  }
    }
    tick();
  }
